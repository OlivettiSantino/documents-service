[project]
name = "documents-service"
version = "1.0.0"
description = "Microservicio de persistencia de documentos PDF procesados"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "motor>=3.6.0",
    "httpx>=0.28.1",
    "python-multipart>=0.0.12",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.22.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--ignore=tests/integration"
markers = [
    "integration: requiere una instancia real de MongoDB",
]

[tool.uv]
package = false
