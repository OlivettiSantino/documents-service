# Stack autonomo: este servicio y su propia base. extract-service NO se levanta
# aca: se llama por EXTRACT_URL, que por default es el gateway (Traefik, en
# pdf_extractext-infra), para no acoplar este repositorio al del extractor (ver
# README, "Como apuntar a extract-service").
#
# "documents" se suma ademas a la red externa compartida "mired", donde viven
# Consul, Traefik y las replicas de extract. Hay que crearla una sola vez por maquina:
#
#   docker network create mired
#   docker compose up --build

services:
  mongo:
    image: mongo:7.0
    # Database per service: base privada, sin publicar el puerto al host.
    volumes:
      - documents_data:/data/db
    healthcheck:
      # mongosh tarda varios segundos solo en arrancar con el limite de CPU de
      # abajo, asi que el timeout es generoso a proposito: lo que se mide es si
      # mongod responde, no lo que tarda el cliente en levantar.
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 20s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "${MONGO_CPUS:-0.5}"
          memory: ${MONGO_MEMORY:-512M}
    restart: unless-stopped

  documents:
    build: .
    ports:
      - "${PORT:-8002}:8002"
    environment:
      PORT: 8002
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB_NAME: ${MONGO_DB_NAME:-documents_db}
      MONGO_TIMEOUT_MS: ${MONGO_TIMEOUT_MS:-3000}
      # Gateway (issue #27): Traefik en mired, puerto 80. Sin "/extract": el
      # cliente lo agrega. Rollback, directo a extract sin Traefik:
      #   EXTRACT_URL=http://extract:8001
      # Para un extract en el host: EXTRACT_URL=http://host.docker.internal:8001
      EXTRACT_URL: ${EXTRACT_URL:-http://traefik}
      # Presupuesto de timeouts (README de infra): documents 27 s corta despues
      # que Traefik (responseHeaderTimeout 25 s) y antes que el cliente (30 s).
      EXTRACT_TIMEOUT: ${EXTRACT_TIMEOUT:-27.0}
      EXTRACT_CONNECT_TIMEOUT: ${EXTRACT_CONNECT_TIMEOUT:-2.0}
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-52428800}
      # Tope del texto extraido en bytes UTF-8 (issue #32). Menor que los
      # 16 MiB de un documento BSON; si se supera -> 422.
      MAX_CONTENT_BYTES: ${MAX_CONTENT_BYTES:-15728640}
      # Control de admision (issue #30): uploads en memoria a la vez.
      MAX_CONCURRENT_UPLOADS: ${MAX_CONCURRENT_UPLOADS:-4}
      UPLOAD_SLOT_TIMEOUT: ${UPLOAD_SLOT_TIMEOUT:-2.0}
      MAX_CONCURRENT_EXTRACTIONS: ${MAX_CONCURRENT_EXTRACTIONS:-4}
      BULKHEAD_ACQUIRE_TIMEOUT: ${BULKHEAD_ACQUIRE_TIMEOUT:-2.0}
      BREAKER_FAILURE_THRESHOLD: ${BREAKER_FAILURE_THRESHOLD:-5}
      BREAKER_OPEN_SECONDS: ${BREAKER_OPEN_SECONDS:-15.0}
      BREAKER_WINDOW_SECONDS: ${BREAKER_WINDOW_SECONDS:-30.0}
      # Registro en Consul (issue #23), con los tags que publican a documents
      # en Traefik (issue #27). Encendido por defecto, como en extract. Si
      # Consul no esta, el registro falla con un WARNING y el servicio arranca
      # igual. Solo controla el registro: a extract se llama por EXTRACT_URL.
      # El token sale del .env, nunca del repo.
      CONSUL_ENABLED: ${CONSUL_ENABLED:-true}
      CONSUL_HTTP_ADDR: ${CONSUL_HTTP_ADDR:-http://consul:8500}
      CONSUL_HTTP_TOKEN: ${CONSUL_HTTP_TOKEN:-}
      CONSUL_TIMEOUT: ${CONSUL_TIMEOUT:-2.0}
    networks:
      # Red del proyecto: por aca habla con su propio Mongo.
      default:
      # Red compartida con Consul y las replicas de extract (issue #25).
      mired:
    # Hace que host.docker.internal resuelva tambien en Linux, no solo en
    # Docker Desktop (sirve si extract corre en el host y no en mired).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mongo:
        condition: service_healthy
    deploy:
      # Un solo proceso y una sola replica: el estado del breaker y del
      # bulkhead vive en memoria. Ver "Limites conocidos" en el README.
      replicas: 1
      resources:
        limits:
          cpus: "${DOCUMENTS_CPUS:-1.0}"
          memory: ${DOCUMENTS_MEMORY:-512M}
    restart: unless-stopped

volumes:
  documents_data:

# Mongo queda solo en la red del proyecto a proposito: es la base privada de
# este servicio y nadie de mired tiene por que alcanzarla.
networks:
  # Externa y compartida por los tres repos. Se crea una sola vez por maquina:
  #   docker network create mired
  mired:
    name: ${SHARED_NETWORK:-mired}
    external: true
