# Stack autonomo: este servicio y su propia base. extract-service NO se levanta
# aca: se llama por EXTRACT_URL, que por default es el gateway (Traefik, en
# pdf_extractext-infra), para no acoplar este repositorio al del extractor (ver
# README, "Como apuntar a extract-service").
#
# "documents" se suma ademas a la red externa compartida "mired", donde viven
# Consul, Traefik y las replicas de extract. Hay que crearla una sola vez por maquina:
#
#   docker network create mired
#   docker compose up -d --build --wait
#
# Imagen (12-Factor V): este archivo usa la imagen que publica la CI en GHCR,
# sin "build". docker-compose.override.yml, que Compose lee solo, le agrega el
# build local para desarrollo. Release, sin compilar (ver README):
#
#   DOCUMENTS_IMAGE_TAG=sha-xxxxxxx docker compose -f docker-compose.yml up -d --wait

services:
  mongo:
    # Fijada por tag + digest, como la imagen base del Dockerfile (issue #47):
    # era la unica imagen del sistema sin digest, asi que un "up" de hoy y uno
    # de la semana que viene podian levantar builds distintas del mismo 7.0.
    # Para actualizarla, cambiar el tag y el digest juntos:
    #   docker buildx imagetools inspect mongo:7.0 --format '{{json .Manifest.Digest}}'
    image: mongo:7.0.45@sha256:8bb4442761a63a8dda452744082cdac9644b429807eb977b42324a63cef59ca4
    # Database per service: base privada, sin publicar el puerto al host.
    volumes:
      - documents_data:/data/db
    healthcheck:
      # mongosh tarda varios segundos solo en arrancar con el limite de CPU de
      # abajo, asi que el timeout es generoso a proposito: lo que se mide es si
      # mongod responde, no lo que tarda el cliente en levantar.
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 20s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "${MONGO_CPUS:-0.5}"
          memory: ${MONGO_MEMORY:-512M}
    restart: unless-stopped

  documents:
    # La imagen construida una sola vez por la CI. Vacio o "latest" en
    # desarrollo; un sha-xxxxxxx o vX.Y.Z para una release reproducible.
    # Sin pull_policy (default "missing"): un sha-/vX.Y.Z es inmutable, asi que
    # bajarlo una vez alcanza y no hace falta ir al registro en cada "up".
    # "always" ademas pasaria al override y haria que el desarrollo intente
    # bajar documents-service:dev de Docker Hub. Para refrescar "latest":
    # docker compose -f docker-compose.yml pull documents
    image: ghcr.io/olivettisantino/documents-service:${DOCUMENTS_IMAGE_TAG:-latest}
    # Sin "ports": dos replicas no pueden publicar el mismo puerto del host.
    # Desde afuera se entra solo por Traefik (http://127.0.0.1:8080/documents);
    # el 8002 queda visible para los demas contenedores de las redes.
    expose:
      - "8002"
    environment:
      # Puerto del proceso dentro del contenedor (12-Factor VII). No se publica.
      PORT: 8002
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB_NAME: ${MONGO_DB_NAME:-documents_db}
      MONGO_TIMEOUT_MS: ${MONGO_TIMEOUT_MS:-3000}
      # Retry-After (s) del 503 cuando Mongo no responde (issue #29).
      MONGO_RETRY_AFTER: ${MONGO_RETRY_AFTER:-5}
      # Gateway (issue #27): Traefik en mired, puerto 80. Sin "/extract": el
      # cliente lo agrega. Rollback, directo a extract sin Traefik:
      #   EXTRACT_URL=http://extract:8001
      # Para un extract en el host: EXTRACT_URL=http://host.docker.internal:8001
      EXTRACT_URL: ${EXTRACT_URL:-http://traefik}
      # Presupuesto de timeouts (README de infra): documents 27 s corta despues
      # que Traefik (responseHeaderTimeout 25 s) y antes que el cliente (30 s).
      EXTRACT_TIMEOUT: ${EXTRACT_TIMEOUT:-27.0}
      EXTRACT_CONNECT_TIMEOUT: ${EXTRACT_CONNECT_TIMEOUT:-2.0}
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-52428800}
      # Tope del texto extraido en bytes UTF-8 (issue #32). Menor que los
      # 16 MiB de un documento BSON; si se supera -> 422.
      MAX_CONTENT_BYTES: ${MAX_CONTENT_BYTES:-15728640}
      # Control de admision (issue #30): uploads en memoria a la vez. Acota
      # tambien cuantas extracciones corren juntas. Circuit breaker, retry y
      # limite de concurrencia hacia extract los aplica Traefik (issue #28).
      MAX_CONCURRENT_UPLOADS: ${MAX_CONCURRENT_UPLOADS:-4}
      UPLOAD_SLOT_TIMEOUT: ${UPLOAD_SLOT_TIMEOUT:-2.0}
      # Registro en Consul (issue #23), con los tags que publican a documents
      # en Traefik (issue #27). Encendido por defecto, como en extract. Si
      # Consul no esta, el registro falla con un WARNING y el servicio arranca
      # igual. Solo controla el registro: a extract se llama por EXTRACT_URL.
      # El token sale del .env, nunca del repo.
      CONSUL_ENABLED: ${CONSUL_ENABLED:-true}
      CONSUL_HTTP_ADDR: ${CONSUL_HTTP_ADDR:-http://consul:8500}
      CONSUL_HTTP_TOKEN: ${CONSUL_HTTP_TOKEN:-}
      CONSUL_TIMEOUT: ${CONSUL_TIMEOUT:-2.0}
    networks:
      # Red del proyecto: por aca habla con su propio Mongo.
      default:
      # Red compartida con Consul y las replicas de extract (issue #25).
      mired:
    # Hace que host.docker.internal resuelva tambien en Linux, no solo en
    # Docker Desktop (sirve si extract corre en el host y no en mired).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mongo:
        condition: service_healthy
    deploy:
      # Escalado horizontal (issue #35, 12-Factor VIII):
      #   DOCUMENTS_REPLICAS=3 docker compose up -d --wait
      # Lo que lo permite: no hay puerto publicado en el host, cada replica se
      # registra en Consul con su hostname como service_id (Traefik balancea
      # entre las "passing") y el dedupe entre replicas lo garantiza el indice
      # unico ux_documents_checksum de Mongo. El cupo de uploads es por
      # proceso: el total es replicas x MAX_CONCURRENT_UPLOADS, y la memoria,
      # replicas x DOCUMENTS_MEMORY. Ver "Escalado horizontal" en el README.
      replicas: ${DOCUMENTS_REPLICAS:-1}
      resources:
        limits:
          cpus: "${DOCUMENTS_CPUS:-1.0}"
          memory: ${DOCUMENTS_MEMORY:-512M}
    restart: unless-stopped

volumes:
  documents_data:

# Mongo queda solo en la red del proyecto a proposito: es la base privada de
# este servicio y nadie de mired tiene por que alcanzarla.
networks:
  # Externa y compartida por los tres repos. Se crea una sola vez por maquina:
  #   docker network create mired
  mired:
    name: ${SHARED_NETWORK:-mired}
    external: true
