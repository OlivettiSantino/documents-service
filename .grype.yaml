# Excepciones del escaneo de la imagen con Grype (issue #47).
#
# Grype autodetecta este archivo en la raiz del repo: el job "image" de
# .github/workflows/ci.yml no le pasa "config" justamente para no apagar esa
# autodeteccion, asi que lo que esta aca vale igual en la CI y corriendo Grype
# en la maquina (ver "Escaneo de la imagen" en el README).
#
# El umbral de corte (high o critical, y solo con fix disponible) vive en el
# workflow, no aca: esta lista es para las vulnerabilidades que, cumpliendo ese
# umbral, se decidio igual no bloquear. Cada una lleva el motivo y la fecha en
# la que hay que volver a mirarla.
#
# Formato de una excepcion:
#
#   ignore:
#     # Revisar: 2026-12-31
#     - vulnerability: CVE-0000-00000
#       reason: "por que no aplica, o por que se acepta por ahora"
#       package:
#         name: nombre-del-paquete
#
# "reason" es un campo de Grype y sale en el reporte; la fecha va en el
# comentario, porque el campo no la tiene.
#
# Cada regla lleva tambien el "package", para que no tape el mismo CVE si
# apareciera en otro paquete de la imagen.
ignore:
  # Las dos de abajo las trae el setuptools de la imagen base, en su carpeta
  # _vendor (comprobado en la imagen: setuptools/_vendor/jaraco.context-5.3.0
  # y setuptools/_vendor/wheel-0.45.1). El servicio corre desde /service/.venv,
  # que no instala ni setuptools ni pip, y la app nunca los importa: el codigo
  # vulnerable esta en la imagen pero no se ejecuta. Subirlas exigiria
  # actualizar el pip de la base, fuera del alcance de la #47.
  # Revisar: 2026-12-31
  - vulnerability: GHSA-58pv-8j8x-9vj2
    reason: "jaraco-context 5.3.0 vendored en setuptools de la imagen base; no se importa en runtime"
    package:
      name: jaraco-context
  # Revisar: 2026-12-31
  - vulnerability: GHSA-8rrh-rw8j-w5fx
    reason: "wheel 0.45.1 vendored en setuptools de la imagen base; no se importa en runtime"
    package:
      name: wheel
  # zlib1g: el fix es 1:1.3.dfsg+really1.3.1-1+deb13u1 y la imagen base trae
  # +b1. No esta en python:3.11-slim, tampoco en su digest mas nuevo
  # (comprobado el 2026-11-08, sha256:07d48240...b535: da los mismos 4 high).
  # Traerlo con un "apt-get upgrade" en el build romperia la reproducibilidad
  # que el Dockerfile fija por digest a proposito: dos builds del mismo commit
  # dejarian de dar la misma imagen. Se levanta la excepcion cuando la base
  # publique el paquete parcheado.
  # Revisar: 2026-12-31
  - vulnerability: CVE-2026-76844
    reason: "fix solo en deb13u1, que python:3.11-slim todavia no trae"
    package:
      name: zlib1g
  # Revisar: 2026-12-31
  - vulnerability: CVE-2026-85091
    reason: "fix solo en deb13u1, que python:3.11-slim todavia no trae"
    package:
      name: zlib1g
